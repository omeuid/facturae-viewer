name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish portable (win-x64)
        run: dotnet publish src/Facturae.App -c Release -r win-x64 --self-contained /p:PublishSingleFile=true -o artifacts/publish

      - name: Upload artefacto portable
        uses: actions/upload-artifact@v6
        with:
          name: FacturaeViewer-win-x64
          path: artifacts/publish/FacturaeViewer.exe

      - name: Asegurar Inno Setup (preinstalado en el runner)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Compilar instalador
        shell: pwsh
        run: iscc installer/setup.iss

      - name: Upload artefacto instalador
        uses: actions/upload-artifact@v6
        with:
          name: FacturaeViewer-Setup
          path: artifacts/installer/FacturaeViewer-Setup.exe

      - name: Crear release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.2.0
        with:
          files: |
            artifacts/publish/FacturaeViewer.exe
            artifacts/installer/FacturaeViewer-Setup.exe
          fail_on_unmatched_files: true